name: Bug
description: Something in the hub or an SDK does not work as documented
labels: [bug]
body:
  - type: dropdown
    id: part
    attributes:
      label: Where
      options: [hub, Go SDK, Node SDK, Python SDK, Ruby SDK, PHP SDK, Java SDK, .NET SDK, Rust SDK]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The hub image tag or the SDK version
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: The request, the response or error, and the steps to reproduce. Leave out API keys and secrets.
    validations:
      required: true
