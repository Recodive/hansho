name: security

# Scheduled and per-change security checks for the hub and the SDKs. CodeQL runs separately through GitHub's
# default setup, and secret scanning with push protection is on for the repository.
# Trivy is deliberately not used: its GitHub Action had 76 of 77 tags force-pushed to credential-stealing malware
# in March 2026 (CVE-2026-33634). Every action here is pinned to a commit.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # Mondays: new advisories against code that did not change
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [hub, sdk/go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: false
      # Reports only vulnerabilities the code can actually reach, and fails on them.
      - working-directory: ${{ matrix.module }}
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  osv-scanner:
    name: OSV-Scanner
    # Every lockfile and manifest in the repository (Go, npm, PyPI, RubyGems, Composer, Maven, NuGet, crates.io),
    # results in the Security tab.
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      scan-args: |-
        --recursive
        ./

  zizmor:
    name: zizmor (workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
