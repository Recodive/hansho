name: release-sdk

# Publishes one SDK when its tag is pushed: sdk/<lang>/v<version>, e.g. sdk/python/v0.1.0. The tag's version must
# equal the version in the SDK's manifest. Publishing uses each registry's trusted publishing (GitHub OIDC, no
# stored token) where the registry has it; each registry must first trust this repository and this workflow
# (see sdk/RELEASING.md). Maven Central has no trusted publishing and needs the secrets listed there.
# Go needs no job: the sdk/go/v* tag is the release.
on:
  push:
    tags:
      - "sdk/*/v*"

permissions:
  contents: read

jobs:
  meta:
    name: Which SDK
    runs-on: ubuntu-latest
    outputs:
      lang: ${{ steps.m.outputs.lang }}
      version: ${{ steps.m.outputs.version }}
    steps:
      # Every publish job needs this one, so nothing is published from a tag that is not on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME is not on main" >&2; exit 1; }
      - id: m
        env:
          REF: ${{ github.ref_name }}
        run: |
          case "$REF" in sdk/*/v[0-9]*) ;; *) echo "unexpected tag $REF" >&2; exit 1 ;; esac
          lang=${REF#sdk/}; lang=${lang%%/*}
          echo "lang=$lang" >> "$GITHUB_OUTPUT"
          echo "version=${REF##*/v}" >> "$GITHUB_OUTPUT"

  node:
    needs: meta
    if: needs.meta.outputs.lang == 'node'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: version matches tag
        env:
          WANT: ${{ needs.meta.outputs.version }}
        run: test "$(node -p 'require("./package.json").version')" = "$WANT"
      - run: npm ci && npm test && npm run check:package
      # npm 11.5+ publishes with the workflow's OIDC token once the package trusts this workflow.
      - run: npm install -g npm@12.2.3 && npm publish --access public --provenance

  python:
    needs: meta
    if: needs.meta.outputs.lang == 'python'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: version matches tag
        working-directory: sdk/python
        env:
          WANT: ${{ needs.meta.outputs.version }}
        run: grep -qx "__version__ = \"$WANT\"" hansho/_version.py
      - name: test and build
        working-directory: sdk/python
        run: uv run --python 3.13 -m unittest && uv build --out-dir ../../dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  ruby:
    needs: meta
    if: needs.meta.outputs.lang == 'ruby'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/ruby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1
        with:
          ruby-version: "3.4"
      - name: version matches tag
        env:
          WANT: ${{ needs.meta.outputs.version }}
        run: grep -q "VERSION = \"$WANT\"" lib/hansho/version.rb
      - run: bundle install && bundle exec rake test && gem build hansho.gemspec
      # Done by hand instead of rubygems/configure-rubygems-credentials: the first push of a gem must name the account
      # whose pending trusted publisher may create it (owner = the Recodive account's immutable id), and the
      # action has no input for that yet.
      - name: exchange the OIDC token for a short-lived RubyGems key
        env:
          RUBYGEMS_OWNER_ID: "256573"
        run: |
          jwt=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rubygems.org" | jq -r .value)
          key=$(jq -nc --arg jwt "$jwt" --arg owner "$RUBYGEMS_OWNER_ID" '{jwt: $jwt, owner: $owner}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' -d @- https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token | jq -r .rubygems_api_key)
          echo "::add-mask::$key"
          echo "GEM_HOST_API_KEY=$key" >> "$GITHUB_ENV"
      - run: gem push hansho-*.gem

  dotnet:
    needs: meta
    if: needs.meta.outputs.lang == 'dotnet'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: version matches tag
        env:
          WANT: ${{ needs.meta.outputs.version }}
        run: grep -q "<Version>$WANT</Version>" src/Hansho/Hansho.csproj
      - run: dotnet test -c Release && dotnet pack src/Hansho -c Release -o "$RUNNER_TEMP/nupkg"
      # Short-lived key from the nuget.org trusted publishing policy (vars.NUGET_USER: the nuget.org account name).
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "$RUNNER_TEMP"/nupkg/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json

  rust:
    needs: meta
    if: needs.meta.outputs.lang == 'rust'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: version matches tag
        env:
          WANT: ${{ needs.meta.outputs.version }}
        run: grep -qx "version = \"$WANT\"" Cargo.toml
      - run: cargo test
      # crates.io trusted publishing works from the second release on; the first one uses CARGO_REGISTRY_TOKEN.
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: auth
        if: ${{ env.FIRST_TOKEN == '' }}
        env:
          FIRST_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

  java:
    needs: meta
    if: needs.meta.outputs.lang == 'java'
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: sdk/java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: version matches tag
        env:
          WANT: ${{ needs.meta.outputs.version }}
        run: test "$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)" = "$WANT"
      - env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -Prelease deploy

  php:
    name: Mirror to Recodive/hansho-php (Packagist reads that repository)
    needs: meta
    if: needs.meta.outputs.lang == 'php'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: split sdk/php and push it with the version tag
        env:
          DEPLOY_KEY: ${{ secrets.HANSHO_PHP_DEPLOY_KEY }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null ~/.deploy_key
          printf '%s\n' "$DEPLOY_KEY" > ~/.deploy_key
          export GIT_SSH_COMMAND="ssh -i $HOME/.deploy_key -o StrictHostKeyChecking=accept-new"
          git subtree split --prefix=sdk/php -b php-split
          git push git@github.com:Recodive/hansho-php.git php-split:refs/heads/main
          git push git@github.com:Recodive/hansho-php.git "php-split:refs/tags/v$VERSION"
