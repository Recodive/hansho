[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hansho"
dynamic = ["version"]
description = "Official Python client for a Hansho hub: pair users, send notifications, pages, Live Activities and widget feeds, verify webhooks."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Recodive" }]
keywords = ["hansho", "push notifications", "apns", "live activities", "paging", "alerting"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Recodive/hansho/tree/main/sdk/python#readme"
Repository = "https://github.com/Recodive/hansho"

[tool.hatch.version]
path = "hansho/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["hansho"]

[tool.hatch.build.targets.sdist]
include = ["/hansho", "/README.md", "/LICENSE"]
