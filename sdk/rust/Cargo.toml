[package]
name = "hansho"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
# MSRV-aware dependency resolution (picks releases that still build on rust-version).
resolver = "3"
description = "Official Rust client for a Hansho hub: pair users, send notifications, pages, Live Activities and widget feeds, verify webhooks."
license = "MIT"
readme = "README.md"
homepage = "https://github.com/Recodive/hansho/tree/main/sdk/rust#readme"
repository = "https://github.com/Recodive/hansho"
keywords = ["hansho", "push-notifications", "apns", "paging", "alerting"]
categories = ["api-bindings", "web-programming::http-client"]
# The tests read ../spec/*.json, which lives outside the package, so they are not shipped.
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
